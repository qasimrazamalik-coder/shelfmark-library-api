openapi: 3.0.3
info:
  title: Shelfmark Library API
  version: 1.0.0
  description: |
    Circulation backend for a small library: catalogue search, loans, renewals,
    a first-come-first-served hold queue, overdue fines and staff reporting.

    Errors always look like `{ "error": { "code": "LOAN_LIMIT", "message": "...", "details": ... } }`.
    Clients should branch on `code`, never on `message`.

    Seed accounts (password `password123`): admin@shelfmark.test, librarian@shelfmark.test, amina@shelfmark.test
servers:
  - url: /api
tags:
  - name: Auth
  - name: Catalogue
  - name: Loans
  - name: Holds
  - name: Fines
  - name: Staff
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: NO_COPY_AVAILABLE }
            message: { type: string }
            details: {}
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [member, librarian, admin] }
        cardNumber: { type: string, example: SM-2041-7730 }
    AuthResult:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Book:
      type: object
      properties:
        id: { type: integer }
        isbn: { type: string, nullable: true }
        title: { type: string }
        author: { type: string }
        publishedYear: { type: integer, nullable: true }
        subjects: { type: array, items: { type: string } }
        replacementCents: { type: integer }
        totalCopies: { type: integer }
        availableCopies: { type: integer }
        queueLength: { type: integer }
    BookInput:
      type: object
      required: [title, author]
      properties:
        isbn: { type: string, example: '9780132350884' }
        title: { type: string }
        author: { type: string }
        publishedYear: { type: integer }
        subjects: { type: array, items: { type: string } }
        replacementCents: { type: integer, default: 2500 }
    Loan:
      type: object
      properties:
        id: { type: integer }
        memberId: { type: integer }
        memberName: { type: string }
        bookId: { type: integer }
        title: { type: string }
        author: { type: string }
        barcode: { type: string }
        loanedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time, nullable: true }
        renewals: { type: integer }
        renewalsLeft: { type: integer }
        daysOverdue: { type: integer }
        accruingCents: { type: integer, description: Fine that would be charged if returned now }
        canRenew: { type: boolean }
        renewBlockers: { type: array, items: { type: string, enum: [OVERDUE, RENEWAL_LIMIT, TITLE_ON_HOLD, LOAN_CLOSED] } }
    Standing:
      type: object
      properties:
        activeLoans: { type: integer }
        maxLoans: { type: integer }
        overdueLoans: { type: integer }
        unpaidCents: { type: integer }
        blockAtCents: { type: integer }
        canBorrow: { type: boolean }
        blockers: { type: array, items: { type: string, enum: [LOAN_LIMIT, HAS_OVERDUE, FINES_OWED] } }
    Hold:
      type: object
      properties:
        id: { type: integer }
        bookId: { type: integer }
        title: { type: string }
        status: { type: string, enum: [waiting, ready] }
        position: { type: integer, nullable: true }
        pickupBy: { type: string, format: date-time, nullable: true }
        barcode: { type: string, nullable: true }
    Fine:
      type: object
      properties:
        id: { type: integer }
        memberId: { type: integer }
        amountCents: { type: integer }
        reason: { type: string }
        title: { type: string }
        status: { type: string, enum: [unpaid, paid, waived] }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
security:
  - bearer: []
paths:
  /health:
    get: { tags: [Staff], security: [], summary: Liveness and database check, responses: { '200': { description: OK } } }
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Create a member account
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name, email, password], properties: { name: { type: string }, email: { type: string }, password: { type: string, minLength: 8 } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in (rate limited to 20 attempts per 15 minutes)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { email: { type: string }, password: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/me:
    get: { tags: [Auth], summary: Current user, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } } }
  /books:
    get:
      tags: [Catalogue]
      security: []
      summary: Search the catalogue (prefix full-text search over title, author and subjects)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: available, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Book' } }, page: { type: integer }, limit: { type: integer }, total: { type: integer } } }
    post:
      tags: [Catalogue]
      summary: Add a title (staff)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BookInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Book' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /books/subjects:
    get: { tags: [Catalogue], security: [], summary: Subjects with book counts, responses: { '200': { description: OK } } }
  /books/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { tags: [Catalogue], security: [], summary: Title with its copies and due dates, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Catalogue], summary: Edit a title (staff), requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/BookInput' } } } }, responses: { '200': { description: OK } } }
    delete: { tags: [Catalogue], summary: 'Delete a title with no loan history (admin)', responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /books/{id}/copies:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Catalogue]
      summary: Add a physical copy (staff). If people are waiting, it goes straight to the hold shelf.
      requestBody: { content: { application/json: { schema: { type: object, required: [barcode], properties: { barcode: { type: string }, shelfLocation: { type: string } } } } } }
      responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } }
  /loans:
    get:
      tags: [Loans]
      summary: List loans. Members always get only their own.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, returned, all], default: open } }
        - { name: overdue, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: memberId, in: query, description: Staff only, schema: { type: integer } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Loan' } } } } } }
    post:
      tags: [Loans]
      summary: Check out
      description: |
        Members borrow by `bookId`. Staff can also check out by `barcode` for a member
        given by `memberId` or `memberCard`. Fails with LOAN_LIMIT, HAS_OVERDUE, FINES_OWED,
        NO_COPY_AVAILABLE, RESERVED_FOR_ANOTHER or ALREADY_BORROWED.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { bookId: { type: integer }, barcode: { type: string }, memberId: { type: integer }, memberCard: { type: string } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Loan' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /loans/standing:
    get: { tags: [Loans], summary: Whether the signed-in member may borrow, and why not, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Standing' } } } } } }
  /loans/return:
    post:
      tags: [Loans]
      summary: Check in by barcode (staff). Computes any late fine and routes the copy to the hold queue.
      requestBody: { content: { application/json: { schema: { type: object, required: [barcode], properties: { barcode: { type: string } } } } } }
      responses: { '200': { description: 'Returns { loan, daysLate, fine, heldFor }' }, '404': { $ref: '#/components/responses/Error' } }
  /loans/{id}/renew:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { tags: [Loans], summary: 'Renew (max 2, not overdue, nobody waiting)', responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } }
  /loans/{id}/lost:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { tags: [Loans], summary: Declare lost (staff). Charges replacement cost., responses: { '200': { description: OK } } }
  /holds:
    get:
      tags: [Holds]
      summary: Active holds. Staff can pass scope=shelf or scope=all.
      parameters: [{ name: scope, in: query, schema: { type: string, enum: [mine, shelf, all] } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Hold' } } } } } }
    post:
      tags: [Holds]
      summary: Join the queue for a title with no copy on the shelf
      requestBody: { content: { application/json: { schema: { type: object, required: [bookId], properties: { bookId: { type: integer } } } } } }
      responses: { '201': { description: 'Returns { id, position }' }, '409': { $ref: '#/components/responses/Error' } }
  /holds/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    delete: { tags: [Holds], summary: Cancel. A ready copy moves to the next person., responses: { '204': { description: Cancelled } } }
  /holds/expire:
    post: { tags: [Holds], summary: Run the hold-expiry job now (staff; also runs every minute), responses: { '200': { description: OK } } }
  /fines:
    get:
      tags: [Fines]
      parameters: [{ name: status, in: query, schema: { type: string, enum: [unpaid, all] } }, { name: memberId, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Fine' } } } } } }
  /fines/{id}/pay:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post: { tags: [Fines], summary: Record payment (staff), responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } } }
  /fines/{id}/waive:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Fines]
      summary: Waive with a written reason (admin)
      requestBody: { content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /members:
    get: { tags: [Staff], summary: Find members by name, email or card, parameters: [{ name: q, in: query, schema: { type: string } }], responses: { '200': { description: OK } } }
  /members/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get: { tags: [Staff], summary: Member with standing, responses: { '200': { description: OK } } }
  /members/{id}/role:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch: { tags: [Staff], summary: Change role (admin), responses: { '200': { description: OK } } }
  /staff/summary:
    get: { tags: [Staff], summary: Desk counters, responses: { '200': { description: OK } } }
  /staff/popular:
    get: { tags: [Staff], summary: Most borrowed titles, parameters: [{ name: days, in: query, schema: { type: integer } }], responses: { '200': { description: OK } } }
  /staff/activity:
    get: { tags: [Staff], summary: Loans and returns per day, responses: { '200': { description: OK } } }
  /staff/audit:
    get: { tags: [Staff], summary: Audit trail, responses: { '200': { description: OK } } }
  /staff/copies/{barcode}:
    parameters: [{ name: barcode, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Staff], summary: 'Mark a copy available, withdrawn or lost', responses: { '200': { description: OK } } }
